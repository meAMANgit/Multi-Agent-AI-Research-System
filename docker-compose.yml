services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-core-api
    command: python -m uvicorn src.research_system.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DEFAULT_LLM_PROVIDER=mock
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research-core-ui
    command: python -m streamlit run src/research_system/ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - DEFAULT_LLM_PROVIDER=mock
      - API_HOST=api
      - API_PORT=8000
    depends_on:
      - api
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
